<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News App</title>
    <link
      rel="preload"
      href="./styles.css?v=1"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />

    <noscript>
      <link rel="stylesheet" href="./styles.css" />
    </noscript>
  </head>
  <body>
    <main id="app-content" class="layout"></main>

    <div id="donatePopup" class="popup" style="display: none">
      <div class="popup-content">
        <span class="close-popup" id="closeDonate">&times;</span>
        <h2>Support Us</h2>
        <div class="donate-options">
          <button class="donate-option">100 UAH</button>
          <button class="donate-option">200 UAH</button>
          <button class="donate-option">500 UAH</button>
          <button class="donate-option">1000 UAH</button>
        </div>
        <p class="thank-you" style="display: none">Thanks for support</p>
      </div>
    </div>

    <div id="loginPopup" class="popup" style="display: none">
      <div class="popup-content">
        <span class="close-popup" id="closeLogin">&times;</span>
        <h2 class="login-header">Login</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email:</label>
            <input type="email" id="loginEmail" required />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password:</label>
            <input type="password" id="loginPassword" required />
          </div>
          <button type="submit">Login</button>
        </form>
      </div>
    </div>

    <script type="module" src="./scripts/main.js?v=1" defer></script>
  </body>
</html>
